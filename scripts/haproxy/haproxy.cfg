# HAProxy in front of gomesh-broker.
#
# Terminates TLS for Cloudflare-proxied MQTT-over-WebSocket traffic, requires
# Cloudflare's Authenticated Origin Pulls client certificate (so only
# Cloudflare can connect, which makes CF-Connecting-IP trustworthy), and
# forwards to the broker over plain WS with a PROXY v2 header carrying the
# real client address.
#
# Installed to /etc/haproxy/haproxy.cfg by `just install-haproxy`.

global
    log /dev/log local0
    maxconn 8192
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    # Applies once the WebSocket upgrade completes. MQTT keepalives keep live
    # sessions well inside this; Cloudflare itself drops idle WebSockets at 100s.
    timeout tunnel 10m

# Concurrent connections per real client IP, shared by both frontends.
backend per_ip
    stick-table type ipv6 size 100k expire 10m store conn_cur

frontend stg
    bind :8443 ssl crt /etc/haproxy/certs/gomesh.pem ca-file /etc/haproxy/certs/cloudflare-origin-pull-ca.pem verify required
    http-request set-src req.hdr(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found }
    http-request track-sc0 src table per_ip
    # Backstop only: anonymous-vs-authenticated limits live in the broker.
    http-request deny deny_status 429 if { sc0_conn_cur gt 32 }
    default_backend broker_stg

# Production. Kept disabled until the cutover, while gomesh-broker still owns :443.
frontend prod
    disabled
    bind :443 ssl crt /etc/haproxy/certs/gomesh.pem ca-file /etc/haproxy/certs/cloudflare-origin-pull-ca.pem verify required
    http-request set-src req.hdr(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found }
    http-request track-sc0 src table per_ip
    http-request deny deny_status 429 if { sc0_conn_cur gt 32 }
    default_backend broker_prod

backend broker_stg
    server broker 127.0.0.1:8081 send-proxy-v2

backend broker_prod
    server broker 127.0.0.1:8080 send-proxy-v2
